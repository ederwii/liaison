# liaison bridge — create ONE app from this manifest at https://api.slack.com/apps
# (Create New App → From a manifest → paste this). Then:
#   1. Basic Information → App-Level Tokens → Generate (scope: connections:write) → xapp-…
#   2. Install to workspace → Bot User OAuth Token → xoxb-…
#   3. Put both tokens in ~/.liaison/.env as LIAISON_APP_TOKEN and LIAISON_BOT_TOKEN (chmod 600).
display_information:
  name: liaison
  description: Bridge between your Claude Code sessions and Slack — updates, questions with buttons, per-project channels.
  background_color: "#1a1d21"
features:
  bot_user:
    display_name: liaison
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:manage      # auto-create per-project channels
      - channels:join
      - channels:history
      - channels:read
      - im:history
      - im:write
      - users:read
      - reactions:read      # see the reactions people add to messages (reaction_added below)
      - reactions:write     # slack-ack reacts ✅ to say "a session read this"
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - reaction_added      # an allowlisted person reacts; the bridge records it in the inbox
      - reaction_removed
  interactivity:
    is_enabled: true         # buttons/selects
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
